name: FTTx — кнопка «Обновить сейчас»

# Каждые 5 минут проверяет, не нажали ли в Telegram «🔄 Обновить сейчас» (или /update),
# и запускает задачу обновления данных из Qlik на ноутбуке. GitHub может запускать
# проверку с опозданием на несколько минут.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: telegram-listen
  cancel-in-progress: false

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Проверить запросы из Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ROUTINE_FIRE_URL: ${{ secrets.ROUTINE_FIRE_URL }}
          ROUTINE_FIRE_TOKEN: ${{ secrets.ROUTINE_FIRE_TOKEN }}
        run: python3 scripts/telegram_listen.py
