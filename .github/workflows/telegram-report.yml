name: FTTx — сводка в Telegram

on:
  push:
    branches: [main]
    paths: [data.json]         # после каждого обновления данных из Qlik — всем подписчикам
  workflow_dispatch:           # ручной запуск: Actions → Run workflow (всем) или из FTTx-бота (одному чату)
    inputs:
      chat_id:
        description: "ID чата, если сводку нужно отправить только ему (пусто — всем)"
        required: false
        default: ""

# Без отмены параллельных запусков: сводки по запросу разных людей не должны отменять друг друга.

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Защита от дублей: если data.json закоммичен повторно с теми же данными WFM (тот же asOf,
      # например два обновлятеля поймали одну перезагрузку Qlik), сводку не отправляем.
      # Принудительное обновление из Telegram (новое поле forced) отправляется всегда.
      - name: Проверить, что данные новые
        id: chk
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          key() { python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('asOf',''), d.get('forced',''), sep='|')"; }
          new=$(key < data.json)
          old=""
          if git fetch -q --no-tags --depth=1 origin "$BEFORE" 2>/dev/null; then
            old=$(git show "$BEFORE:data.json" 2>/dev/null | key 2>/dev/null || true)
          fi
          echo "было: ${old:-нет}  стало: $new"
          if [ -n "$old" ] && [ "$old" = "$new" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Данные WFM не изменились ($new) — повторную сводку не отправляем."
          fi
      - if: steps.chk.outputs.skip != 'true'
        run: pip install openpyxl
      - name: Собрать и отправить сводку
        if: steps.chk.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: https://dinarazaiko.github.io/fttx-dashboard/
          TO_CHAT: ${{ github.event.inputs.chat_id }}
        run: python scripts/telegram_report.py --data data.json --send --to "$TO_CHAT"
