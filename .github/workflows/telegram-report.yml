name: FTTx — сводка в Telegram

on:
  push:
    branches: [main]
    paths: [data.json]         # после каждого обновления данных из Qlik
  workflow_dispatch:           # ручной запуск: Actions → Run workflow

# если data.json обновили два раза подряд — отправится только последняя сводка
concurrency:
  group: telegram-report
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: Собрать и отправить сводку
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: https://dinarazaiko.github.io/fttx-dashboard/
        run: python scripts/telegram_report.py --data data.json --send
