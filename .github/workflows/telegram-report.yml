name: FTTx — сводка в Telegram

on:
  push:
    branches: [main]
    paths: [data.json]         # после каждого обновления данных из Qlik — всем подписчикам
  workflow_dispatch:           # ручной запуск: Actions → Run workflow (всем) или из FTTx-бота (одному чату)
    inputs:
      chat_id:
        description: "ID чата, если сводку нужно отправить только ему (пусто — всем)"
        required: false
        default: ""

# Без отмены параллельных запусков: сводки по запросу разных людей не должны отменять друг друга.

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: Собрать и отправить сводку
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: https://dinarazaiko.github.io/fttx-dashboard/
          TO_CHAT: ${{ github.event.inputs.chat_id }}
        run: python scripts/telegram_report.py --data data.json --send --to "$TO_CHAT"
